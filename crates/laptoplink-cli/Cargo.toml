[package]
name = "laptoplink-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "LaptopLink command-line interface."

# The CLI logic lives in a library so both the short `laplink` command and the
# `laptoplink` alias (src/bin/*.rs) can share one implementation.
[lib]
name = "laptoplink_cli"
path = "src/lib.rs"

[dependencies]
laptoplink-core = { path = "../laptoplink-core" }
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
rand.workspace = true
