name: CI

# The default branch for this repository is `production`.
on:
  push:
    branches: [production, main, develop]
  pull_request:
    branches: [production, main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Formatting and lints run once on Linux — fast feedback.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Build + test across the three primary desktop platforms.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --verbose
      - name: Test
        run: cargo test --workspace --verbose
      # The benchmark drives a loopback transfer in one process; see the note
      # in the integration tests about Windows and in-process loopback.
      - name: Smoke test (loopback benchmark)
        if: runner.os != 'Windows'
        run: cargo run --release --bin laplink -- --home ./.ll-ci benchmark --size-mib 32
        shell: bash
