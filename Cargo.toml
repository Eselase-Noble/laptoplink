[workspace]
resolver = "2"
members = ["crates/laptoplink-core", "crates/laptoplink-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"
repository = "https://example.com/laptoplink"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
blake3 = "1.5"
snow = "0.9"
rand = "0.8"
hex = "0.4"
directories = "5"
walkdir = "2"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
