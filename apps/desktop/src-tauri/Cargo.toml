[package]
name = "laptoplink-desktop"
version = "0.1.1"
edition = "2021"
description = "LaptopLink desktop app (Tauri)."
license = "MIT OR Apache-2.0"
# Kept out of the root workspace so the core/CLI builds stay lean; this crate
# has its own lockfile.
[workspace]

[lib]
name = "laptoplink_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
laptoplink-core = { path = "../../../crates/laptoplink-core" }
